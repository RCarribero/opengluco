<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenGluco | Monitor Clínico de Glucosa en Tiempo Real</title>
  <meta name="description" content="OpenGluco v1.2.2 — Ecosistema clínico de monitorización continua de glucosa para Android, Wear OS y Android Auto." />
  <link rel="icon" type="image/png" href="favicon.png?v=2" />
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=2" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="og-shell">
    <!-- Top Ecosystem Navigation Bar -->
    <header class="og-ecosystem-bar">
      <div class="og-brand-row">
        <img src="logo.png" alt="OpenGluco Logo" class="og-brand-logo" />
        <span class="og-brand-title">OpenGluco</span>
        <span class="og-version-pill">v1.2.2</span>
      </div>

      <!-- Multi-Device Switcher -->
      <nav class="og-device-tabs" aria-label="Selector de dispositivo">
        <button type="button" class="og-device-tab active" data-device="mobile">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect>
            <line x1="12" y1="18" x2="12.01" y2="18"></line>
          </svg>
          App Móvil
        </button>
        <button type="button" class="og-device-tab" data-device="wear">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="7"></circle>
            <polyline points="12 9 12 12 13.5 13.5"></polyline>
            <path d="M16.51 17.35l-.35 3.83a2 2 0 0 1-2 1.82H9.83a2 2 0 0 1-2-1.82l-.35-3.83m.01-10.7l.35-3.83A2 2 0 0 1 9.83 1h4.35a2 2 0 0 1 2 1.82l.35 3.83"></path>
          </svg>
          Wear OS
        </button>
        <button type="button" class="og-device-tab" data-device="auto">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"></path>
            <circle cx="6.5" cy="16.5" r="2.5"></circle>
            <circle cx="16.5" cy="16.5" r="2.5"></circle>
          </svg>
          Android Auto
        </button>
      </nav>

      <!-- Global Quick Controls -->
      <div style="display:flex; align-items:center; gap:8px;">
        <button type="button" id="og-unit-toggle" class="og-preset-btn" title="Cambiar unidad clínica">
          mg/dL
        </button>
        <button type="button" id="og-theme-toggle" class="og-preset-btn" title="Alternar tema OLED / Claro">
          OLED
        </button>
      </div>
    </header>

    <!-- Live Clinical Telemetry Control Bar -->
    <section class="og-sim-strip" id="og-sim-strip">
      <div class="og-sim-label">
        <span class="og-pulse-dot" id="og-sim-dot"></span>
        <span>Telemetría CGM en Vivo</span>
      </div>

      <div class="og-sim-slider-wrap">
        <input
          type="range"
          id="og-glucose-slider"
          class="og-sim-slider"
          min="45"
          max="290"
          value="114"
        />
        <span id="og-slider-readout" style="font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700; min-width:74px;">
          114 mg/dL
        </span>
      </div>

      <div class="og-sim-presets">
        <button type="button" class="og-preset-btn" data-preset="normal">Estable (114)</button>
        <button type="button" class="og-preset-btn" data-preset="rising">Postprandial (164)</button>
        <button type="button" class="og-preset-btn" data-preset="high">Hiperglucemia (218)</button>
        <button type="button" class="og-preset-btn" data-preset="low">Hipoglucemia (63)</button>
        <button type="button" class="og-preset-btn" data-preset="urgent">Urgente Bajo (51)</button>
      </div>
    </section>

    <!-- Main Interactive Application Root -->
    <main class="og-viewport" id="og-app-root"></main>

    <!-- Modal Root -->
    <div id="og-modal-root"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
